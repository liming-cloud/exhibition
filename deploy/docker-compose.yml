# 运行 Release 包里的构建产物（app/），只使用官方基础镜像，本机与服务器一致。
# 由 scripts/install.sh 调用，变量来自 $EXH_HOME/.env
name: exhibition

services:
  mysql:
    image: mysql:8.0.40
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      MYSQL_DATABASE: exhibition
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 服务器只有 2G 内存，压低 MySQL 占用
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  admin-api:
    image: eclipse-temurin:17-jre
    restart: unless-stopped
    command: ["java", "-Xms128m", "-Xmx384m", "-jar", "/app/admin.jar"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/exhibition?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      # 数据库中已存的文件路径是绝对路径（沿用旧服务器目录），容器内保持同一路径
      UPLOAD: /Users/sunliming/work/text
      TZ: Asia/Shanghai
    volumes:
      - ./app/admin.jar:/app/admin.jar:ro
      - upload-data:/Users/sunliming/work/text
    depends_on:
      mysql:
        condition: service_healthy

  webside:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/app/server/index.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_API_BASE: http://admin-api:8080
      NODE_OPTIONS: --max-old-space-size=256
      TZ: Asia/Shanghai
    volumes:
      - ./app/webside:/app:ro
    depends_on:
      - admin-api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/locations.conf:/etc/nginx/snippets/locations.conf:ro
      - ./app/admin-dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - webside
      - admin-api

volumes:
  mysql-data:
  upload-data:
