# 服务器启用 HTTPS：在 .env 中设置 COMPOSE_FILE=docker-compose.yml:docker-compose.https.yml
# 证书由宿主机 acme.sh 安装到 $CERT_DIR（见 scripts/server-init.sh）
services:
  nginx:
    ports:
      - "443:443"
    volumes:
      - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERT_DIR:?请在 .env 中设置 CERT_DIR}:/etc/nginx/certs:ro
