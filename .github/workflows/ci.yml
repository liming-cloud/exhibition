# 三端构建检查，命令与 deploy/scripts/release.sh 一致；master 分支保护要求三项都通过
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -q -B -f admin/pom.xml -DskipTests package

  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exhibition-admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: exhibition-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  webside:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exhibition-webside
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: exhibition-webside/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 正式构建
        run: pnpm build
      - name: 原型 mock 构建
        run: pnpm build
        env:
          NUXT_PUBLIC_MOCK: '1'
